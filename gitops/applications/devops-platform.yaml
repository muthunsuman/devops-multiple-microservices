apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-platform-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/muthunsuman/devops-multiple-microservices.git
    targetRevision: main
    path: gitops/environments/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true